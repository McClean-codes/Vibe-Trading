[project]
name = "croesus-toolset"
version = "0.1.0"
description = "Enrichment toolset lifted from Vibe-Trading: indicators, backtest metrics, risk x-ray"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
fetch = [
    "yfinance>=0.2.30",
    "ccxt>=4.0.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
croesus = "croesus_toolset.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
